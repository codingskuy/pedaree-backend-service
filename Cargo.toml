[package]
name = "pedaree-backend-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.84.1"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "chrono", "uuid", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[features]
# Provider state handler untuk verifikasi Pact (lokal/CI uji saja, bukan rilis).
pact-state = []

[dev-dependencies]
http-body-util = "0.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }

# Argon2 di build dev/test sangat lambat tanpa optimasi.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
